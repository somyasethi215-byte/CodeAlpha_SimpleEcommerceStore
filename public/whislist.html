<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist | ShopEase</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .wishlist-page {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .wishlist-header {
            margin-bottom: 30px;
        }

        .wishlist-header h1 {
            margin-bottom: 8px;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .wishlist-card {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            overflow: hidden;
            background: white;
        }

        .wishlist-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            cursor: pointer;
        }

        .wishlist-content {
            padding: 16px;
        }

        .wishlist-content h3 {
            margin: 0 0 8px;
        }

        .wishlist-price {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .wishlist-actions {
            display: flex;
            gap: 8px;
        }

        .wishlist-actions button {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .wishlist-cart {
            background: #111827;
            color: white;
        }

        .wishlist-remove {
            background: #f1f1f1;
        }

        .wishlist-empty {
            text-align: center;
            padding: 80px 20px;
        }

        @media (max-width: 900px) {
            .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .wishlist-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="categories.html">Categories</a>
        <a href="cart.html">🛒 Cart</a>
        <a href="orders.html">My Orders</a>
    </nav>
</header>

<main class="wishlist-page">

    <div class="wishlist-header">
        <h1>❤️ My Wishlist</h1>
        <p>Save products you want to buy later.</p>
    </div>

    <div id="wishlistGrid" class="wishlist-grid"></div>

</main>

<script src="js/wishlist.js"></script>

</body>
</html>
