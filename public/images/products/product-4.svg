
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
            <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#f8fafc"/>
                    <stop offset="1" stop-color="#e2e8f0"/>
                </linearGradient>
                <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#ffffff"/>
                    <stop offset="1" stop-color="#cbd5e1"/>
                </linearGradient>
                <filter id="shadow">
                    <feGaussianBlur stdDeviation="20"/>
                </filter>
            </defs>

            <rect width="900" height="700" fill="url(#bg)"/>

            <ellipse cx="450" cy="555" rx="250" ry="40"
                     fill="#64748b"
                     opacity=".3"
                     filter="url(#shadow)"/>

            <g transform="translate(210 145)">
                <rect x="0" y="40"
                      width="480"
                      height="350"
                      rx="35"
                      fill="url(#box)"
                      stroke="#94a3b8"
                      stroke-width="8"/>

                <rect x="35" y="75"
                      width="410"
                      height="100"
                      rx="20"
                      fill="#e5e7eb"/>

                <rect x="70" y="215"
                      width="150"
                      height="110"
                      rx="18"
                      fill="#3b82f6"/>

                <rect x="250" y="215"
                      width="150"
                      height="110"
                      rx="18"
                      fill="#6366f1"/>

                <circle cx="145" cy="270" r="35"
                        fill="#bfdbfe"/>

                <circle cx="325" cy="270" r="35"
                        fill="#c7d2fe"/>
            </g>

            <text x="450" y="625"
                  text-anchor="middle"
                  font-family="Arial"
                  font-size="27"
                  font-weight="700"
                  fill="#374151">
                Backpack
            </text>
        </svg>
    